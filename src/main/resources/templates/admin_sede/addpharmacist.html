<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
        <meta name="description" content="POS - Bootstrap Admin Template">
		<meta name="keywords" content="admin, estimates, bootstrap, business, corporate, creative, invoice, html5, responsive, Projects">
        <meta name="author" content="Dreamguys - Bootstrap Admin Template">
        <meta name="robots" content="noindex, nofollow">
        <title>SaintMedic</title>

		
		<!-- Favicon -->
		<link rel="shortcut icon" type="image/x-icon" href="/assets_superAdmin/img/PastillaSinFondo.png">
		
		<!-- Bootstrap CSS -->
        <link rel="stylesheet" href="/assets_superAdmin/css/bootstrap.min.css">
		
		<!-- animation CSS -->
        <link rel="stylesheet" href="/assets_superAdmin/css/animate.css">

		<!-- Select2 CSS -->
		<link rel="stylesheet" href="/assets_superAdmin/plugins/select2/css/select2.min.css">

		<!-- Datatable CSS -->
		<link rel="stylesheet" href="/assets_superAdmin/css/dataTables.bootstrap4.min.css">
		
        <!-- Fontawesome CSS -->
		<link rel="stylesheet" href="/assets_superAdmin/plugins/fontawesome/css/fontawesome.min.css">
		<link rel="stylesheet" href="/assets_superAdmin/plugins/fontawesome/css/all.min.css">
		
		<!-- Main CSS -->
        <link rel="stylesheet" href="/assets_superAdmin/css/style.css">
		<style>

			.btn-shine {
				text-align: center;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				padding: 12px 48px;
				color: #fff;
				background: linear-gradient(to right, #FF6F43 0, #FF5F43 10%, white 10%);
				background-position: 0;
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				animation: shine 3s infinite linear;
				animation-fill-mode: forwards;
				-webkit-text-size-adjust: none;
				font-weight: 600;
				font-size: 16px;
				text-decoration: none;
				white-space: nowrap;
				font-family: "Poppins", sans-serif;
			}
			@-moz-keyframes shine {
				0% {
					background-position: 0;
				}
				60% {
					background-position: 180px;
				}
				100% {
					background-position: 180px;
				}
			}
			@-webkit-keyframes shine {
				0% {
					background-position: 0;
				}
				60% {
					background-position: 180px;
				}
				100% {
					background-position: 180px;
				}
			}
			@-o-keyframes shine {
				0% {
					background-position: 0;
				}
				60% {
					background-position: 180px;
				}
				100% {
					background-position: 180px;
				}
			}
			@keyframes shine {
				0% {
					background-position: 0;
				}
				60% {
					background-position: 180px;
				}
				100% {
					background-position: 180px;
				}
			}
		</style>
		
    </head>
    <body>
		
		<div id="global-loader" >
			<div class="whirly-loader"> </div>
		</div>
	
		 
		<!-- Main Wrapper -->
        <div class="main-wrapper">

			<!-- Header -->
			<div th:replace="headerAdminSede"> </div>

			<!-- Header -->

			<!--sideBar-->
			<div th:replace="sidebarAdmin :: sidebarAdmin(activeTab = 'farmacista')"> </div>

			<!-- /Sidebar -->

			<div class="page-wrapper">
				<div class="content">
					<div class="page-header">
						<div class="page-title">
							<h4>Agregar farmacista</h4>
						</div>
					</div>
					<!-- /add -->
					<form method="post" enctype="multipart/form-data" th:action="@{'/adminSede/agregarFarmacista'}" th:object="${farmacista}">
						<input type="hidden" th:field="*{state}" th:value="'valor_estado_predeterminado'">
						<input type="hidden" th:field="*{site}" th:value="'valor_estado_predeterminado'">
						<div class="card">
							<div class="card-body">
								<div class="row">
									<div class="col-lg-3 col-sm-6 col-12">
										<div class="form-group">
											<label for="dniFarmacista">DNI</label>
											<input class="form-control" name="dni" id="dniFarmacista" type="text" th:field="*{dni}">
											<div th:if="${errorDNI != null}"  class="text-danger" >
												<span th:text="${errorDNI}"></span>
											</div>
										</div>
									</div>
									<script>
										function capitalizeName(name) {
											// Separar el nombre por espacios en blanco
											const words = name.split(' ');

											// Capitalizar el primer carácter de cada palabra y unir el resto en minúsculas
											const capitalizedWords = words.map(word => {
												return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
											});

											// Unir las palabras nuevamente en un string
											return capitalizedWords.join(' ');
										}
										document.addEventListener('DOMContentLoaded', ()=>{
											let dni =  document.getElementById("dniFarmacista");
											dni.addEventListener('input', (event)=>{
												let cantidad = event.target.value.length;
												if(cantidad=== 8){
													//Hacemos consulta con ajax
													$.ajax({
														url: '/adminSede/getDni?dni='+dni.value,
														type:'GET',
														success: function(response){
															let name =  capitalizeName(response.nombres) ;
															let lastName = capitalizeName(response.apellidoPaterno +" "+  response.apellidoMaterno);
															let nameId = document.getElementById("nameFarmacista");
															let lastNameId = document.getElementById("lastNameFarmacist");
															nameId.value = name;
															nameId.placeholder = name;
															lastNameId.value = lastName;
															lastNameId.placeholder = lastName;
														},
														error: function(response){
															swal.fire({
																icon: "error",
																title: "No se encontro el DNI",
															});
														}
													});
												}
											});
										});
									</script>

									<div class="col-lg-3 col-sm-6 col-12">
										<div class="form-group">
											<label for="nameFarmacista">Nombre</label>
											<input readonly class="form-control" name="name" id="nameFarmacista" type="text" th:field="*{name}">
											<div th:if="${errorNombre != null}"  class="text-danger" >
												<span th:text="${errorNombre}"></span>
											</div>
										</div>
									</div>
									<div class="col-lg-3 col-sm-6 col-12">
										<div class="form-group">
											<label >Apellido</label>
											<input readonly class="form-control" name="lastName" id="lastNameFarmacist" type="text" th:field="*{lastName}">
											<div th:if="${errorApellido != null}"  class="text-danger" >
												<span th:text="${errorApellido}"></span>
											</div>
										</div>
									</div>


									<div class="col-lg-3 col-sm-6 col-12">
										<div class="form-group">
											<label for="codigoFarmacista">Código de Colegiatura</label>
											<input class="form-control" name="code" id="codigoFarmacista" type="text" th:field="*{code}">
											<div th:if="${errorCODE != null}"  class="text-danger" >
												<span th:text="${errorCODE}"></span>
											</div>
										</div>
									</div>
									<div class="col-lg-3 col-sm-6 col-12">
										<div class="form-group">
											<label for="correoFarmacista">Correo</label>
											<input class="form-control" name="email" id="correoFarmacista" type="text" th:field="*{email}">
											<div th:if="${errorEmail != null}"  class="text-danger" >
												<span th:text="${errorEmail}"></span>
											</div>
										</div>
									</div>
									<div class="col-lg-3 col-sm-6 col-12">
										<div class="form-group">
											<label for="distritoFarmacista">Distrito de residencia</label>
											<input class="form-control" name="distrit" id="distritoFarmacista" type="text" th:field="*{distrit}">
											<div th:if="${errorDistrito != null}"  class="text-danger" >
												<span th:text="${errorDistrito}"></span>
											</div>
										</div>
									</div>

									<div class="col-lg-12">
										<div class="form-group">
											<label for="fileInput">Foto de Usuario</label>
											<div class="image-upload">
												<input name="foto" id="fileInput" accept="image/*" type="file">
												<div class="image-preview" style="display: none; text-align: center; margin-bottom: 20px;">
													<img id="previewImage" src="" alt="img" style="max-width: 100%; height: auto; border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);">
												</div>
												<div class="image-uploads" style="text-align: center; margin-bottom: 20px;">
													<img src="/assets_superAdmin/img/icons/upload.svg" alt="img">
													<h4>Subir imagen</h4>
												</div>
												<div class="text-danger" th:if="${imageError}" th:text="${imageError}"></div>
											</div>
										</div>
									</div>
									<script>
										const fileInput = document.getElementById('fileInput');
										const previewImage = document.getElementById('previewImage');
										const imagePreview = document.querySelector('.image-preview');

										fileInput.addEventListener('change', function() {
											const file = this.files[0];
											const reader = new FileReader();

											reader.onload = function(event) {
												previewImage.src = event.target.result;
												imagePreview.style.display = 'block';
											};

											reader.readAsDataURL(file);
										});

										// Posicionar el contenedor de la imagen previsualizada
										const formGroup = document.querySelector('.form-group');
										const imagePreviewPosition = {
											top: formGroup.offsetTop + formGroup.offsetHeight + 10,
											left: formGroup.offsetLeft
										};
										imagePreview.style.top = `${imagePreviewPosition.top}px`;
										imagePreview.style.left = `${imagePreviewPosition.left}px`;
									</script>
									<div class="col-lg-12">
										<a th:href="@{'/adminSede/listaFarmacista'}" class="btn btn-cancel">Cancelar</a>
										<button type="submit" class="btn btn-submit me-2">Enviar solicitud</button>
									</div>
								</div>
							</div>
						</div>
					</form>

					<!-- /add -->
				</div>
			</div>
        </div>
		<!-- /Main Wrapper -->
		 
		<!-- jQuery -->
        <script src="/assets_superAdmin/js/jquery-3.6.0.min.js"></script>

        <!-- Feather Icon JS -->
		<script src="/assets_superAdmin/js/feather.min.js"></script>

		<!-- Slimscroll JS -->
		<script src="/assets_superAdmin/js/jquery.slimscroll.min.js"></script>

		<!-- Datatable JS -->
		<script src="/assets_superAdmin/js/jquery.dataTables.min.js"></script>
		<script src="/assets_superAdmin/js/dataTables.bootstrap4.min.js"></script>
		
		<!-- Bootstrap Core JS -->
        <script src="/assets_superAdmin/js/bootstrap.bundle.min.js"></script>

		<!-- Select2 JS -->
		<script src="/assets_superAdmin/plugins/select2/js/select2.min.js"></script>

		<!-- Sweetalert 2 -->
		<script src="/assets_superAdmin/plugins/sweetalert/sweetalert2.all.min.js"></script>
		<script src="/assets_superAdmin/plugins/sweetalert/sweetalerts.min.js"></script>

		<!-- Custom JS -->
		<script src="/assets_superAdmin/js/script.js"></script>
		
    </body>
</html>
