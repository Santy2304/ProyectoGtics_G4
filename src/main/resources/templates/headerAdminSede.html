        <a href="#" class="logo-small">
            <img src="/assets_superAdmin/img/PastillaSinFondo.png" alt="">
        </a>
        <a id="toggle_btn" href="javascript:void(0);">
        </a>
    </div>
    <!-- /Logo -->

    <a id="mobile_btn" class="mobile_btn" href="#sidebar">
					<span class="bar-icon">
						<span></span>
						<span></span>
						<span></span>
					</span>
    </a>

    <!-- Header Menu -->
    <ul class="nav user-menu">

        <!-- Search -->


        <li class="nav-item dropdown has-arrow flag-nav">
            <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown"  role="button" style="color:white" th:text="|Administrador de ${sede}|">
                <img src="/assets_pacient/img/flags/us1.png" alt="" height="20">
            </a>
        </li>
        <!--
        <li class="nav-item"><a style="color: white;" th:text="|Administrador de ${sede}|"></a>
        </li>-->
        <li class="nav-item dropdown">
            <a id="campana" href="javascript:void(0);" class="dropdown-toggle nav-link" data-bs-toggle="dropdown">
                <img src="/assets_superAdmin/img/icons/notification-bing.svg" alt="img"> <span style="background-color: red; width: 20%;height: 20%; border-radius: 50%;display: none" id="rojito"  class="badge rounded-pill"></span>
            </a>
            <div class="dropdown-menu notifications">
                <div class="topnav-dropdown-header">
                    <span class="notification-title">Notificaciones</span>
                </div>
                <div class="noti-content">
                    <ul class="notification-list">

                        <li class="notification-message" th:each="notifications:${listaNotiUWU}">
                            <a href="/pharmacist/verNotificationsFarmacista">
                                <div class="media d-flex">
                                    <span class="avatar flex-shrink-0">
                                        <img alt="" src="/assets_superAdmin/img/Farmacista.jpeg">
                                    </span>
                                    <div class="media-body flex-grow-1">
                                        <p class="noti-details"  th:text="${notifications.getContent()}"></p>
                                        <p class="noti-time"><span class="notification-time" th:text="${#temporals.format(notifications.getDate(), 'yyyy/MM/dd HH:mm')}"></span></p>
                                    </div>
                                </div>
                            </a>
                        </li>


                    </ul>
                </div>
                <div class="topnav-dropdown-footer">
                    <a th:href="@{/adminSede/verNotificacionesAdminSede}">Mira todas las notificaciones</a>
                </div>
            </div>
        </li>

        <script>

            function connect() {
                var socket = new SockJS('/ws');  // Crear una nueva instancia de SockJS
                stompClient = Stomp.over(socket);  // Crear un cliente STOMP sobre el socket SockJS
                stompClient.connect({}, function (frame) {
                    console.log('Connected: ' + frame);
                    stompClient.subscribe('/user/queue/messages', function (message) {
                        var badge = document.getElementById('rojito');
                        console.log("prueba");
                        badge.style.display = 'inline-block';
                        let noti =  document.getElementById('noti');
                        noti.insertBefore(insertar((JSON.parse(message.body)).content), noti.firstChild);
                    });
                    // Suscribirse a la cola de mensajes del usuario
                    //Debemos verificar q el farmacista sea de la sede donde estamos

                });
            }

            document.addEventListener("DOMContentLoaded",()=>{connect();});


            let a = document.getElementById("campana");
            let badgeee = document.getElementById('rojito');

            a.addEventListener("click",()=>{
                console.log("prueba");
                badgeee.style.display = 'none';
            });

            function insertar(content){
                let li = document.createElement('li');
                li.className = 'notification-message';

                let a = document.createElement('a');
                a.href = '/pharmacist/verNotificationsFarmacista';

                let mediaDiv = document.createElement('div');
                mediaDiv.className = 'media d-flex';

                let span = document.createElement('span');
                span.className = 'avatar flex-shrink-0';

                let img = document.createElement('img');
                img.alt = '';
                img.src = '/assets_superAdmin/img/Farmacista.jpeg';

                span.appendChild(img);

                let mediaBodyDiv = document.createElement('div');
                mediaBodyDiv.className = 'media-body flex-grow-1';

                let notiDetails = document.createElement('p');
                notiDetails.className = 'noti-details';
                notiDetails.textContent = content;

                let notiTime = document.createElement('p');
                notiTime.className = 'noti-time';

                let notificationTime = document.createElement('span');
                notificationTime.className = 'notification-time';
                notificationTime.textContent = getCurrentFormattedDate();

                notiTime.appendChild(notificationTime);
                mediaBodyDiv.appendChild(notiDetails);
                mediaBodyDiv.appendChild(notiTime);

                mediaDiv.appendChild(span);
                mediaDiv.appendChild(mediaBodyDiv);

                a.appendChild(mediaDiv);
                li.appendChild(a);

                return li;
            }

            function getCurrentFormattedDate() {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                return `${year}/${month}/${day} ${hours}:${minutes}`;
            }
        </script>


        <!-- /Notifications -->

        <li class="nav-item dropdown has-arrow main-drop">
            <a href="javascript:void(0);" class="dropdown-toggle nav-link userset" data-bs-toggle="dropdown">
                            <span class="user-img"><img th:src="|/imagenes/${session.usuario.photo}|" alt="">
							<span class="status online"></span></span>
            </a>
            <div class="dropdown-menu menu-drop-user">
                <div class="profilename">
                    <div class="profileset">
									<span class="user-img"><img th:src="|/imagenes/${session.usuario.photo}|"alt="">
									<span class="status online"></span></span>
                        <div class="profilesets">
                            <h6 th:text="${session.usuario.name} +' '+${session.usuario.lastName}"></h6>
                            <h5 th:text="${rol}"></h5>
                            <h5 th:text="|Sede: ${sede}|"></h5>
                        </div>
                    </div>
                    <hr class="m-0">
                    <a class="dropdown-item" href="/adminSede/verPerfilAdminSede"> <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-user me-2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg> Mi perfil </a>
                    <hr class="m-0">
                    <form th:action="@{/logout}" method="post" class="ml-2">
                        <button class="btn btn-link" type="submit">
                            <a class="dropdown-item logout pb-0" >
                                <img type="submit" src="/assets_superAdmin/img/icons/log-out.svg" alt="Logout" width="25" height="25" >
                                Cerrar sesión
                            </a>
                        </button>
                    </form>
                </div>
            </div>
        </li>
    </ul>
    <!-- /Header Menu -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

</div>
