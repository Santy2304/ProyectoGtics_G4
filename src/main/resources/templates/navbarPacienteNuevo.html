<script>

    function connectNotificacion() {
        var socket = new SockJS('/ws');  // Crear una nueva instancia de SockJS
        stompClient = Stomp.over(socket);  // Crear un cliente STOMP sobre el socket SockJS
        stompClient.connect({}, function (frame) {
            console.log('Connected: ' + frame);
            stompClient.subscribe('/user/queue/messages', function (message) {
                var badge = document.getElementById('rojito');
                console.log("prueba");
                badge.style.display = 'inline-block';
                let noti =  document.getElementById('noti');
                noti.insertBefore(insertar((JSON.parse(message.body)).content), noti.firstChild);
            });
            // Suscribirse a la cola de mensajes del usuario
            //Debemos verificar q el farmacista sea de la sede donde estamos

        });
    }



    let a = document.getElementById("campana");
    let badgeee = document.getElementById('rojito');

    a.addEventListener("click",()=>{
         console.log("prueba");
         badgeee.style.display = 'none';
     });

     function insertar(content){
         let li = document.createElement('li');
         li.className = 'notification-message';

         let a = document.createElement('a');
         a.href = '/pharmacist/verNotificationsFarmacista';

         let mediaDiv = document.createElement('div');
         mediaDiv.className = 'media d-flex';

         let span = document.createElement('span');
         span.className = 'avatar flex-shrink-0';

         let img = document.createElement('img');
         img.alt = '';
         img.src = '/assets_superAdmin/img/Farmacista.jpeg';

         span.appendChild(img);

         let mediaBodyDiv = document.createElement('div');
         mediaBodyDiv.className = 'media-body flex-grow-1';

         let notiDetails = document.createElement('p');
         notiDetails.className = 'noti-details';
         notiDetails.textContent = content;

         let notiTime = document.createElement('p');
         notiTime.className = 'noti-time';

         let notificationTime = document.createElement('span');
         notificationTime.className = 'notification-time';
         notificationTime.textContent = getCurrentFormattedDate();

         notiTime.appendChild(notificationTime);
         mediaBodyDiv.appendChild(notiDetails);
         mediaBodyDiv.appendChild(notiTime);

         mediaDiv.appendChild(span);
         mediaDiv.appendChild(mediaBodyDiv);

         a.appendChild(mediaDiv);
         li.appendChild(a);

            return li;
     }

    function getCurrentFormattedDate() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        return `${year}/${month}/${day} ${hours}:${minutes}`;
    }
</script>

    <style>
        @keyframes vibrar {
            0% { transform: translate(0, 0); }
            25% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            75% { transform: translate(2px, -2px); }
            100% { transform: translate(-2px, 2px); }
        }

        .vibrar {
            animation: vibrar 0.1s infinite;

    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            function logHolaCada2Segundos() {
                setInterval(() => {
                    $.ajax({
                        url: '/patient/getAllCarrito',
                        type: 'GET',
                        success: function (response) {
                            var listaMedicamentos = response;

                            const elemento = document.getElementById("cantidadCarrito");

                            elemento.innerText = ""+ listaMedicamentos.length;
                            if (elemento.textContent !== ("" +listaMedicamentos.length )){
                                var img = document.getElementById('imagencita');
                                //imagencita
                                img.classList.toggle('vibrar');
                            }
                            //productset
                            //"${medicamento.getIdMedicine()}"
                        },
                        error: function (error) {
                            console.error('There was a problem with the request:', error);
                        }
                    });
                }, 1000); // 2000 milisegundos = 2 segundos
            }
            // Llamar a la función para iniciar el intervalo
            logHolaCada2Segundos();
        });



    </script>
