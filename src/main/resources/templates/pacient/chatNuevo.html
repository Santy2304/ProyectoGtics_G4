    document.addEventListener('DOMContentLoaded', ()=>{

          console.log("mensaje iniciales");

      });

  // Conectar al servidor WebSocket
    function connect() {
      var socket = new SockJS('/ws');  // Crear una nueva instancia de SockJS
      stompClient = Stomp.over(socket);  // Crear un cliente STOMP sobre el socket SockJS
      stompClient.connect({}, function (frame) {
        console.log('Connected: ' + frame);
        stompClient.subscribe('/user/queue/messages', function (message) {
          $.ajax({
            url: "/patient/verificarCorreoPharmacist?email=" +  (JSON.parse(message.body)).sender,
            type: "GET",
            success : function (response){
              console.log
              if(response.content === "si"){
                //Debemos de cambiar la hora
                createMessageReceiver((JSON.parse(message.body)).content,obtenerHoraActual()) ;
                //Cambiamos el ultimo mensaje visible
                let last = document.getElementById("last");
                last.textContent = (JSON.parse(message.body)).content;
                let lastTime = document.getElementById("lastTime");
                lastTime.textContent = obtenerHoraActual();
                document.getElementById("chatContent").scrollTo({
                  top: document.getElementById("chatContent").scrollHeight,
                  behavior: 'auto' // Puedes cambiar a 'auto' si no quieres un desplazamiento suave
                });
              }
            }
          });
        });
        // Suscribirse a la cola de mensajes del usuario
        //Debemos verificar q el farmacista sea de la sede donde estamos
      });
    }
    function formatDateTimeTo12Hour(dateTimeString) {
      // Crear un objeto Date a partir de la cadena DateTime
      const date = new Date(dateTimeString);

      // Opciones para formatear la hora a formato de 12 horas
      const options = {
        hour: 'numeric',
        minute: 'numeric',
        hour12: true
      };

      // Formatear la hora usando toLocaleTimeString con configuración regional para Latinoamérica
      return date.toLocaleTimeString('es-LA', options);
    }
  // Enviar mensaje
    function sendMessage() {
    let message = document.getElementById('message').value;
    $.ajax({
      url: "/patient/getCorreo",
      type: "GET",
      success: function(response){
        stompClient.send("/app/chat", {}, JSON.stringify({
          'sender': [[${session.usuario.email}]] ,  // Cambiar esto por el usuario autenticado
          'recipient': response.correo,
          'content': message
        }));
        document.getElementById("chatContent").scrollTo({
          top: document.getElementById("chatContent").scrollHeight,
          behavior: 'auto' // Puedes cambiar a 'auto' si no quieres un desplazamiento suave
        });
      },
      error: function(response){
        console.log("error");
      }
    });
    }
    function sendImage(file) {
      $.ajax({
        url: "/patient/getCorreo",
        type: "GET",
        success: function(response){
          let datos = {
            'sender': [[${session.usuario.email}]] ,  // Cambiar esto por el usuario autenticado
            'recipient': response.correo ,
            'content': ""
          };
          let cosa = new FormData;
          cosa.append('image', file );
          $.ajax({
            url: '/saveImage',
            type: 'POST',
            data: cosa ,
            contentType: false,
            processData: false,
            success: function(response){
              stompClient.send("/app/chatImage", {},JSON.stringify(datos));
              //Agregamos ultima imagen
              $.ajax({
                url: '/recuperarLastImage' ,
                type: 'GET',
                xhrFields: {
                  responseType: 'blob' // Especificar que la respuesta es un blob
                },
                success: function(response){
                  let url = URL.createObjectURL(response);
                  //Creamos imagen
                  createMessageSenderImagen(url ,obtenerHoraActual() );
                  document.getElementById('message').readOnly = false ;
                  document.getElementById('message').placeholder = "Escribe tu mensaje..." ;
                  let imageAAA = document.getElementById('imagenInput');
                  imageAAA.value = "";
                  document.getElementById("chatContent").scrollTo({
                    top: document.getElementById("chatContent").scrollHeight,
                    behavior: 'auto' // Puedes cambiar a 'auto' si no quieres un desplazamiento suave
                  });
                },
                error: function(response){
                  console.log("Ayudenme");
                }
              });
            },
            error: function(response){
               console.log(response.message);
            }
          });
          console.log(datos);
        },
        error: function(response){
          console.log("error");
        }
      })
    }

    function createChatMessage(imageUrl, time) {
      // Crear el contenedor principal
      const chatMessageDiv = document.createElement('div');

      // Crear el contenedor de adjuntos
      const chatMsgAttachmentsDiv = document.createElement('div');
      chatMsgAttachmentsDiv.classList.add('chat-msg-attachments');

      // Crear el contenedor de un adjunto
      const chatAttachmentDiv = document.createElement('div');
      chatAttachmentDiv.classList.add('chat-attachment');

      // Crear la imagen del adjunto
      const img = document.createElement('img');
      img.src = imageUrl;
      img.alt = 'Attachment';

      // Crear el enlace de descarga del adjunto
      const downloadLink = document.createElement('a');
      downloadLink.href = imageUrl;
      downloadLink.download = 'recetaChat.jpg';
      downloadLink.classList.add('chat-attach-download');

      // Crear el icono de descarga
      const downloadIcon = document.createElement('i');
      downloadIcon.classList.add('fas', 'fa-download');

      // Agregar el icono al enlace
      downloadLink.appendChild(downloadIcon);

      // Agregar la imagen y el enlace de descarga al contenedor del adjunto
      chatAttachmentDiv.appendChild(img);
      chatAttachmentDiv.appendChild(downloadLink);

      // Agregar el contenedor del adjunto al contenedor de adjuntos
      chatMsgAttachmentsDiv.appendChild(chatAttachmentDiv);

      // Crear la lista de información del mensaje
      const chatMsgInfoUl = document.createElement('ul');
      chatMsgInfoUl.classList.add('chat-msg-info');

      // Crear el elemento de lista para la hora del mensaje
      const chatMsgInfoLi = document.createElement('li');

      // Crear el contenedor de la hora
      const chatTimeDiv = document.createElement('div');
      chatTimeDiv.classList.add('chat-time');

      // Crear el span de la hora
      const chatTimeSpan = document.createElement('span');
      chatTimeSpan.textContent = time;

      // Agregar el span al contenedor de la hora
      chatTimeDiv.appendChild(chatTimeSpan);

      // Agregar el contenedor de la hora al elemento de lista
      chatMsgInfoLi.appendChild(chatTimeDiv);

      // Agregar el elemento de lista a la lista de información del mensaje
      chatMsgInfoUl.appendChild(chatMsgInfoLi);

      // Agregar el contenedor de adjuntos y la lista de información al contenedor principal
      chatMessageDiv.appendChild(chatMsgAttachmentsDiv);
      chatMessageDiv.appendChild(chatMsgInfoUl);

      // Retornar el contenedor principal
      return chatMessageDiv;
    }
    function obtenerHoraActual() {
      let ahora = new Date();
      let horas = ahora.getHours();
      let minutos = ahora.getMinutes();
      let ampm = horas >= 12 ? 'PM' : 'AM';

      // Convertir las horas al formato de 12 horas
      horas = horas % 12;
      horas = horas ? horas : 12; // La medianoche debe mostrarse como 12 AM

      // Formatear la salida
      let horaFormateada = horas + ':' + (minutos < 10 ? '0' + minutos : minutos) + ' ' + ampm;
      return horaFormateada;
    }
