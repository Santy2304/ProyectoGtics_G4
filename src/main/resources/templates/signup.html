<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
        <title>Saint Medic</title>
        <link rel="shortcut icon" type="image/x-icon" href="/assets_superAdmin/img/PastillaSinFondo.png">
        <link rel="stylesheet" href="/assets_superAdmin/css/bootstrap.min.css">
        <link rel="stylesheet" href="/assets_superAdmin/plugins/fontawesome/css/fontawesome.min.css">
        <link rel="stylesheet" href="/assets_superAdmin/plugins/fontawesome/css/all.min.css">
        <link rel="stylesheet" href="/assets_superAdmin/css/style.css">
    </head>
        <body class="account-page">
                    <div class="main-wrapper">
                        <div class="account-content">
                            <form  class="login-wrapper" id="miFormulario">
                                <div class="login-content">
                                    <div class="login-userset">
                                        <div class="login-userheading">
                                            <h2>Crear una cuenta</h2>
                                        </div>
                                        <h5 class="mb-2">
                                            Primero, rellena tu DNI para y dale <span style="color: red">"Enter"</span> para continuar. Esto puede tardar unos instantes.
                                        </h5>
                                        <div class="form-login">
                                            <label>DNI</label>
                                            <div class="form-addons">
                                                <input  type="number" onkeydown="obtenerDniOnKey()"  oninput="limitNumber()" onblur="obtenerDniOnBlur()" id="dni" name="dni" placeholder="Ingrese su número de DNI" required>
                                                <img src="/assets_superAdmin/img/icons/users1.svg" alt="img">
                                                <div class="invalid-feedback" id="errorDni" style="display: none "></div>
                                            </div>
                                        </div>
                                        <!--name-->
                                        <div class="form-login">
                                            <label>Nombres</label>
                                            <div class="form-addons">
                                                <input readonly type="number" id="name" name="dni" placeholder="Nombres" required disabled></input>
                                                <img src="/assets_superAdmin/img/icons/users1.svg" alt="img">
                                                <div class="invalid-feedback" id="errorName" style="display: none "></div>
                                            </div>
                                        </div>
                                        <!--lastName-->
                                        <div class="form-login">
                                            <label>Apellidos</label>
                                            <div class="form-addons">
                                                <input readonly type="number" id="lastName" name="dni" placeholder="Apellidos" required disabled>
                                                <img src="/assets_superAdmin/img/icons/users1.svg" alt="img">
                                                <div class="invalid-feedback" id="errorLastName" style="display: none "></div>
                                            </div>
                                        </div>
                                        <!--correo-->
                                        <div class="form-login">
                                            <label>Correo </label>
                                            <div class="form-addons">
                                                <input readonly type="email" id="correo" name="email" placeholder="Ingrese su correo electrónico" required>
                                                <img src="/assets_superAdmin/img/icons/mail.svg" alt="img">
                                                <div class="invalid-feedback" id="errorCorreo" style="display: none "></div>
                                            </div>
                                        </div>
                                        <!--direccion-->
                                        <div class="form-login">
                                            <label>Dirección </label>
                                            <div class="form-addons">
                                                <input readonly  type="text" id="direccion" name="location" placeholder="Ingresa su dirección" required>
                                                <img src="/assets_superAdmin/img/icons/users1.svg" alt="img">
                                                <div class="invalid-feedback" id="errorDireccion" style="display: none " > </div>
                                            </div>
                                        </div>
                                        <!--seguro-->
                                        <div class="form-login">
                                            <label class="mb-2">Seguro</label>
                                            <select  name="insurance"  class="form-control mt-3" >
                                                <option value="Pacífico">Pacífico</option>
                                                <option value="Rímac">Rímac</option>
                                                <option value="La Positiva">La Positiva</option>
                                                <option value="Otro">Otro</option>
                                            </select>
                                            <div class="invalid-feedback" id="errorSeguro" style="display: none " > </div>
                                        </div>
                                        <!--distrit-->
                                        <div class="form-login">
                                            <label class="mb-2">Distrito</label>
                                            <select  name="distrit"  class="form-control mt-3" >
                                                <option value="San Miguel">San Miguel</option>
                                                <option value="Pueblo Libre">Pueblo Libre</option>
                                                <option value="Breña">Breña</option>
                                                <option value="Miraflores">Miraflores</option>
                                                <option value="Magdalena">Magdalena</option>
                                                <option value="San Isidro">San Isidro</option>
                                                <option value="Jesus María">Jesus María</option>
                                                <option value="Barranco">Barranco</option>
                                                <option value="La Molina">La Molina</option>
                                            </select>
                                            <div class="invalid-feedback" id="errorDistrito" style="display: none " > </div>

                                        </div>
                                        <!--boton-->
                                        <div class="form-login">
                                            <button  class="btn btn-login" type="button" id="registro" >Registrarse</button>
                                        </div>
                                        <!--correo-->
                                        <div class="signinform text-center">
                                            <h4>Espere a la confirmación de creación, esto puede tomar unos segundos</h4>
                                        </div>
                                        <div class="signinform text-center">
                                            <h4>¿Ya tienes una cuenta? <a href="/inicioSesion" class="hover-a"> Inicia sesión</a></h4>
                                        </div>
                                    </div>
                                </div>
                                <div class="login-img">
                                    <img src="/assets_superAdmin/img/LogoCentral.jpeg" alt="img">
                                </div>
                            </form>
                        </div>
                    </div>
                    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
                    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>


                    <script>
                        function capitalizeName(name) {
                            const words = name.split(' ');
                            const capitalizedWords = words.map(word => {
                                return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                            });
                            return capitalizedWords.join(' ');
                        }
                        function obtenerDniOnKey (){
                            let dni =  document.getElementById("dni");
                            let name  =  document.getElementById("name");
                            let lastName = document.getElementById("lastName");
                            let correo = document.getElementById("correo");
                            let direccion = document.getElementById("direccion");
                            if(event.key ==='Enter'){
                                $.ajax({
                                    url: "/getDni?dni="+ dni.value,
                                    type:  "GET",
                                    success: function(response){
                                        correo.readOnly = false;
                                        direccion.readOnly = false;
                                        name.placeholder = capitalizeName(response.nombres);
                                        lastName.placeholder= capitalizeName(response.apellidoPaterno + " " + response.apellidoMaterno);
                                    },
                                    error: function(response) {
                                        correo.value="";
                                        direccion.value="";
                                        dni.value = '';
                                        correo.readOnly = true;
                                        direccion.readOnly = true;
                                        name.placeholder = capitalizeName("Nombres");
                                        lastName.placeholder= capitalizeName("Apellidos");
                                        Swal.fire({
                                            icon: "error",
                                            iconColor: "orange",
                                            title: "El número de DNI que ha ingresado no existe",
                                            confirmButtonColor: "#dd986a"
                                        })
                                    }
                                });
                            }
                        }
                        function obtenerDniOnBlur(){
                            let dni =  document.getElementById("dni");
                            let name  =  document.getElementById("name");
                            let lastName = document.getElementById("lastName");
                            let correo = document.getElementById("correo");
                            let direccion = document.getElementById("direccion");
                            $.ajax({
                                    url: "/getDni?dni="+ dni.value,
                                    type:  "GET",
                                    success: function(response){
                                        correo.readOnly = false;
                                        direccion.readOnly = false;
                                        name.placeholder = capitalizeName(response.nombres);
                                        lastName.placeholder= capitalizeName(response.apellidoPaterno + " " + response.apellidoMaterno);
                                    },
                                    error: function(response) {
                                        correo.value="";
                                        direccion.value="";
                                        dni.value = '';
                                        correo.readOnly = true;
                                        direccion.readOnly = true;
                                        name.placeholder = capitalizeName("Nombres");
                                        lastName.placeholder= capitalizeName("Apellidos");
                                        Swal.fire({
                                            icon: "error",
                                            iconColor: "orange",
                                            title: "El número de DNI que ha ingresado no existe",
                                            confirmButtonColor: "#dd986a"
                                        })
                                    }
                                });
                        }
                        function limitNumber(){
                            const maxDigits = 8;
                            const inputField = event.target;

                            if (inputField.value.length > maxDigits) {
                                inputField.value = inputField.value.slice(0, maxDigits);
                            }
                        }
                    </script>
                    <script type="text/javascript">
                        $("#registro").click(function(){
                            let formulario = document.getElementById("miFormulario");
                            let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                            let dni =  document.getElementById("dni");
                            let name  =  document.getElementById("name");
                            let lastName = document.getElementById("lastName");
                            let correo = document.getElementById("correo");
                            let direccion = document.getElementById("direccion");
                            //Validamos antes de consultar por Ajax
                            let error = 0 ;
                            //Validamos vacío
                            if(dni.value.trim() === "" ){
                                //DNI no nulo
                                correo.className= "is-valid";
                                document.getElementById("errorDni").textContent = "Debe ingresar un valor" ;
                                document.getElementById("errorDni").style.display = 'block' ;
                                error++;
                            }else{
                                //Se corrige un error
                                dni.className= "";
                                document.getElementById("errorDni").textContent = "" ;
                                document.getElementById("errorDni").style.display = 'none' ;
                            }
                            if(correo.value.trim() === "" ){
                                //DNI no nulo
                                correo.className= "is-valid";
                                document.getElementById("errorCorreo").textContent = "Debe ingresar un valor" ;
                                document.getElementById("errorCorreo").style.display = 'block' ;
                                error++;
                            }else{
                                //Se corrige un error
                                correo.className= "";
                                document.getElementById("errorCorreo").textContent = "" ;
                                document.getElementById("errorCorreo").style.display = 'none' ;
                            }
                            if(direccion.value.trim() === "" ){
                                //DNI no nulo
                                direccion.className= "is-valid";
                                document.getElementById("errorDireccion").textContent = "Debe ingresar un valor" ;
                                document.getElementById("errorDireccion").style.display = 'block' ;
                                error++;
                            }else{
                                //Se corrige un error
                                direccion.className= "";
                                document.getElementById("errorDireccion").textContent = "" ;
                                document.getElementById("errorDireccion").style.display = 'none' ;
                            }
                            if(!emailRegex.test(correo.value)){
                                //DNI no nulo
                                correo.className= "is-valid";
                                document.getElementById("errorCorreo").textContent = "Debe ingresar un correo válido" ;
                                document.getElementById("errorCorreo").style.display = 'block' ;
                                error++;
                            }else{
                                //Se corrige un error
                                correo.className= "";
                                document.getElementById("errorCorreo").textContent = "" ;
                                document.getElementById("errorCorreo").style.display = 'none' ;
                            }
                            //PREVIAMENTE SE VALIDARON TODOS LOS CAMPOS
                            let datos = $("#miFormulario").serialize();
                            if(datos.insurance ===  ""){
                                //DNI no nulo
                                document.getElementById("errorSeguro").textContent = "Debe escoger un seguro" ;
                                document.getElementById("errorSeguro").style.display = 'block' ;
                                error++;
                            }else{
                                //Se corrige un error

                                document.getElementById("errorSeguro").textContent = "" ;
                                document.getElementById("errorSeguro").style.display = 'none' ;
                            }
                            if(datos.distrit ===  ""){
                                //DNI no nulo
                                document.getElementById("errorDistrito").textContent = "Debe escoger un distrito" ;
                                document.getElementById("errorDistrito").style.display = 'block' ;
                                error++;
                            }else{
                                //Se corrige un error
                                document.getElementById("errorDistrito").textContent = "" ;
                                document.getElementById("errorDistrito").style.display = 'none' ;
                            }
                            if(error>0){
                                $.ajax({
                                    url: "/getDni?dni="+document.getElementById("dni").value,
                                    type: "GET",
                                    success: function (response) {
                                        var nuevoInput1 = document.createElement("input");
                                        var nuevoInput2 = document.createElement("input");
                                        nuevoInput1.type = "text";
                                        nuevoInput1.name = "name";
                                        nuevoInput1.id = "nombre";
                                        nuevoInput1.value= capitalizeName(response.nombres);
                                        nuevoInput2.type = "text";
                                        nuevoInput2.name = "lastName";
                                        nuevoInput2.id = "apellidos";
                                        nuevoInput2.value= capitalizeName(response.apellidoPaterno + " " + response.apellidoMaterno) ;
                                        let datos = $("#miFormulario").serialize();
                                        datos += "&lastName=" + encodeURIComponent(nuevoInput2.value);
                                        datos += "&name=" + encodeURIComponent(nuevoInput1.value);
                                        $.ajax({
                                            url: "/formNuevaCuenta",
                                            type: "POST",
                                            data: datos,
                                            success: function(data) {
                                                switch(data.response){
                                                    case "Guardado":
                                                        Swal.fire({
                                                            icon: "succes",
                                                            iconColor: "orange",
                                                            title: "Bienvenido a SAINT MEDIC",
                                                            text:"Te hemos enviamos un enlace a tu correo para que puedas iniciar sesión",
                                                            confirmButtonColor: "#dd986a"
                                                        }).then((result) => {
                                                            if (result.isConfirmed) {
                                                                window.location.href = '/inicioSesion';
                                                            }
                                                        });
                                                        break;
                                                    case "YaExiste":
                                                        Swal.fire({
                                                            icon: "error",
                                                            iconColor: "orange",
                                                            title: "Este correo o DNI ya tiene una cuenta asociada",
                                                            confirmButtonColor: "#dd986a"
                                                        }).then((result) => {
                                                            if (result.isConfirmed) {
                                                                window.location.href = '/crearCuenta';}
                                                        });
                                                        break;
                                                }
                                            }
                                        });
                                    } ,
                                    error: function(){
                                        Swal.fire({
                                            icon: "error",
                                            iconColor: "orange",
                                            title: "El número de DNI que ha ingresado no existe",
                                            confirmButtonColor: "#dd986a"
                                        }).then((result) => {
                                            if (result.isConfirmed) {
                                                document.getElementById('dni').value = '';
                                            }
                                        });
                                    }
                                });
                            }
                        });


                        </script>
                    <script>
                            function setReadOnly() {
                                const nameField = document.getElementById('name');
                                const lastNameField = document.getElementById('lastName');
                                nameField.setAttribute('readonly', true);
                                lastNameField.setAttribute('readonly', true);
                            }
                            function monitorFields() {
                                const nameField = document.getElementById('name');
                                const lastNameField = document.getElementById('lastName');

                                const observer = new MutationObserver(function(mutations) {
                                    mutations.forEach(function(mutation) {
                                        if (mutation.type === 'attributes') {
                                            if (!nameField.hasAttribute('readonly')) {
                                                nameField.setAttribute('readonly', true);
                                            }
                                            if (!lastNameField.hasAttribute('readonly')) {
                                                lastNameField.setAttribute('readonly', true);
                                            }
                                        }
                                    });
                                });
                                observer.observe(nameField, { attributes: true });
                                observer.observe(lastNameField, { attributes: true });
                            }
                            setReadOnly();
                            monitorFields();
                    </script>
                    <script src="/assets_superAdmin/js/jquery-3.6.0.min.js"></script>
                    <script src="/assets_superAdmin/js/feather.min.js"></script>
                    <script src="/assets_superAdmin/js/bootstrap.bundle.min.js"></script>
                    <script src="/assets_superAdmin/js/script.js"></script>
        </body>
</html>
